    --muted: #a68585;
    --bar: #f2d4d4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201618;
      --card: #2b2022;
      --text: #f2e6e6;
      --muted: #b89a9a;
      --bar: #3a2b2d;

  :root[data-theme="dark"] {
    --bg: #201618;
    --card: #2b2022;
    --text: #f2e6e6;
    --muted: #b89a9a;
    --bar: #3a2b2d;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    margin: 0;
    min-height: 100vh;

  #app { max-width: 460px; width: 100%; }
  h1 {
    font-size: 1.25em;
    text-align: center;
    margin-bottom: 14px;
  }
  #progress {
    height: 6px;
    background: var(--bar);
    border-radius: 3px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  #progress-fill {
    height: 100%;
    background: var(--accent2);
    width: 0%;
    transition: width 0.3s;
  }
  #card {
    background: var(--card);
    border-radius: 16px;
    padding: 26px 20px;
    box-shadow: 0 2px 14px rgba(0,0,0,0.08);
    min-height: 260px;
  }
  #qnum {
    color: var(--muted);
    font-size: 0.85em;
    margin-bottom: 8px;
  }
  #question {
    font-size: 1.08em;
    line-height: 1.6;
    margin-bottom: 20px;
    font-weight: 600;
  }
  .opt-btn {
    display: block;
    width: 100%;
    background: transparent;
    border: 1.5px solid var(--accent);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.98em;
    text-align: left;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .opt-btn:active { background: rgba(201,107,107,0.12); }

  /* 结果页 */
  #result { text-align: center; }
  #result-emoji { font-size: 3.2em; margin-bottom: 6px; }
  #result-title {
    font-size: 1.4em;
    font-weight: 700;
    color: var(--accent2);
    margin-bottom: 10px;
  }
  #result-desc {
    line-height: 1.8;
    text-align: left;
    font-size: 0.98em;
  }
  #result-tips {
    margin-top: 14px;
    padding: 14px;
    background: var(--bg);
    border-radius: 10px;
    font-size: 0.92em;
    text-align: left;
    line-height: 1.7;
  }
  #restart {
    margin: 20px auto 0;
    display: block;
    background: var(--accent2);
    color: white;
    border: none;
    padding: 10px 28px;
    border-radius: 10px;
    font-size: 0.95em;

</head>

  },
  {

    opts: [
      { t: "有没有用心和心意", type: "A" },

    ]
  },
  {
    q: "你在感情中最大的顾虑是：",
    opts: [
      { t: "怕自己爱得比对方多", type: "A" },
      { t: "怕失去自我", type: "B" },
      { t: "怕自己不够好、不被珍惜", type: "C" },
      { t: "怕两人不合适、方向不一致", type: "D" }
    ]
  },
  {
    q: "看到对方情绪低落，你会：",
    opts: [
      { t: "立刻上前安慰、陪伴", type: "A" },
      { t: "给对方空间，等ta主动说", type: "B" },
      { t: "很想安慰但不知道怎么开口", type: "C" },
      { t: "帮忙分析原因、想解决办法", type: "D" }
    ]
  },
  {
    q: "你理想中吵架后的和好方式是：",
    opts: [
      { t: "抱一下就什么都过去了", type: "A" },
      { t: "各自想清楚了再聊", type: "B" },
      { t: "希望对方主动来哄", type: "C" },
      { t: "坐下来把问题说清楚", type: "D" }
    ]
  },
  {
    q: "你认为一段感情最重要的基础是：",
    opts: [
      { t: "深厚的情感依恋", type: "A" },
      { t: "彼此的自由和信任", type: "B" },
      { t: "被重视、被珍惜的感觉", type: "C" },
      { t: "共同的目标和默契", type: "D" }
    ]
  },
  {
    q: "如果对方总加班没时间陪你，你会：",
    opts: [
      { t: "很失落，希望多陪陪自己", type: "A" },
      { t: "理解，各自有各自的事业", type: "B" },
      { t: "心里不满但不说出来", type: "C" },
      { t: "跟对方商量怎么平衡时间", type: "D" }
    ]
  }
];

const typeValue = { A: 1, B: 2, C: 3, D: 4 };

const results = [
  { emoji: "🐱", title: "小奶猫粘人型", desc: "你在爱情里全情投入，喜欢时刻黏在对方身边，享受被需要的感觉，是那种恋爱脑满满的可爱类型。", tips: "小提醒：留一点自己的空间，感情会更有呼吸感。" },
  { emoji: "🌹", title: "热烈甜蜜型", desc: "你的爱直接又浓烈，喜欢用行动和语言表达心意，对方能清楚感受到你的在乎，很少让人猜心思。", tips: "小提醒：偶尔慢一点表达，留点惊喜感也不错。" },
  { emoji: "🧸", title: "温柔依恋型", desc: "你渴望稳定的陪伴和亲密感，重视两人之间的情感连接，愿意为一段关系花很多心思去经营。", tips: "小提醒：安全感也可以自己给自己一部分。" },
  { emoji: "🌙", title: "细腻敏感型", desc: "你的情感很丰富，习惯把很多情绪藏在心里，容易因为一点小细节而想很多，其实很渴望被读懂。", tips: "小提醒：试着多说出真实感受，比猜测更有效。" },
  { emoji: "🍯", title: "温暖治愈型", desc: "你在感情里很会照顾对方情绪，是那种让人觉得很安心、很舒服的类型，擅长营造温馨的相处氛围。", tips: "小提醒：别总是照顾别人，也让自己被好好照顾。" },
  { emoji: "❄️", title: "神秘高冷型", desc: "你在感情里不轻易表露情绪，习惯先观察再行动，看起来有点难懂，但一旦认定就很专一。", tips: "小提醒：适当展示脆弱，会让关系更靠近一步。" },
  { emoji: "🦋", title: "自由洒脱型", desc: "你享受恋爱，但更享受做自己，不会为了关系失去自我，是那种相处很轻松、不粘人的类型。", tips: "小提醒：偶尔主动表达需求，对方会更安心。" },
  { emoji: "🌿", title: "清醒独立型", desc: "你谈恋爱很理性，很少被情绪牵着走，懂得权衡感情和生活的关系，很少因为爱情迷失方向。", tips: "小提醒：理性之外，偶尔放纵一下感性也很浪漫。" },
  { emoji: "🎯", title: "理性务实型", desc: "你喜欢把关系想清楚、说明白，讨厌暧昧不清，是那种能一起认真规划生活的靠谱型恋人。", tips: "小提醒：感情不全是计划表，留点意外惊喜的空间。" },
  { emoji: "🧭", title: "未来规划型", desc: "你谈恋爱目标感很强，重视三观契合和长期发展，喜欢和伴侣一起朝着共同的方向前进。", tips: "小提醒：偶尔停下规划，享受当下的小美好。" }
];

function getResultIndex(sum) {
  const min = 50, max = 200, bucket = (max - min) / results.length;
  let idx = Math.floor((sum - min) / bucket);
  return Math.max(0, Math.min(results.length - 1, idx));
}

let current = 0;
const answers = [];

function renderQuestion() {
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  document.getElementById('restart').style.display = 'none';

  const q = questions[current];
  document.getElementById('qnum').textContent = `第 ${current + 1} / ${questions.length} 题`;
  document.getElementById('question').textContent = q.q;
  document.getElementById('progress-fill').style.width = (current / questions.length * 100) + '%';

  const optsEl = document.getElementById('options');
  optsEl.innerHTML = '';
  q.opts.forEach(o => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = o.t;
    btn.onclick = () => {
      answers.push(o.type);
      current++;
      if (current < questions.length) {
        renderQuestion();
      } else {
        showResult();
      }
    };
    optsEl.appendChild(btn);
  });
}

function showResult() {
  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('quiz').style.display = 'none';

  const sum = answers.reduce((acc, a) => acc + typeValue[a], 0);
  const r = results[getResultIndex(sum)];

  const resultEl = document.getElementById('result');
  resultEl.style.display = 'block';
  resultEl.innerHTML = `
    <div id="result-emoji">${r.emoji}</div>
    <div id="result-title">${r.title}</div>
    <div id="result-desc">${r.desc}</div>
    <div id="result-tips">${r.tips}</div>
  `;
  document.getElementById('restart').style.display = 'block';
}

document.getElementById('restart').onclick = () => {
  current = 0;
  answers.length = 0;
  renderQuestion();
};

renderQuestion();
</script>
